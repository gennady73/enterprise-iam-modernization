# Ansible Inventory for Enterprise Identity Migration and Hardening
# Group and host mapping for the Scaffolded Sunset RHEL 9 environment

[all:vars]
# Domain & Realm configurations
ipa_domain=linux.company.com
ipa_realm=LINUX.COMPANY.COM
ad_domain=ad.company.com

# Standard SSH settings
ansible_user=admin_provisioner
ansible_ssh_private_key_file=~/.ssh/id_rsa_provisioner
ansible_python_interpreter=/usr/bin/python3

[idm_masters]
# Primary Identity Management (IdM) Master Servers
idm-master-01.linux.company.com ansible_host=192.168.10.5
idm-master-02.linux.company.com ansible_host=192.168.10.6

[ds_suppliers]
# Standalone 389-ds / Red Hat Directory Server (RHDS 12) Suppliers
host-a.company.com ansible_host=192.168.20.10 replica_id=1
host-b.company.com ansible_host=192.168.20.11 replica_id=2

[rhel_servers]
# Headless Linux servers to be enrolled into IdM
srv-app-01.linux.company.com ansible_host=192.168.30.50
srv-db-01.linux.company.com ansible_host=192.168.30.51

[rhel_workstations]
# Linux workstations (laptops/desktops) requiring GUI authentication config
ws-fin-101.linux.company.com ansible_host=192.168.40.100
ws-dev-102.linux.company.com ansible_host=192.168.40.101

# Consolidated client group for SSSD configuration and OpenSCAP hardening
[rhel_clients:children]
rhel_servers
rhel_workstations
